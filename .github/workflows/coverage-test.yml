name: Coverage test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/coverage_test.py
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
