name: Scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests scipy
      - run: python scan_all.py
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      - name: Save results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git commit -m "Scan $(TZ=America/Toronto date '+%Y-%m-%d %H:%M')" || echo "No changes"
          git push
